<!doctype html>
<html lang="en">
<head>

  <meta name="theme-color" content="#faf9f6">
  <meta name="description" content="Pets in Tabs brings animated pixel pets to the pages you visit in Chrome.">
  <title>Pets in Tabs</title>
  <link rel="icon" href="./site-assets/yellow-cat.png" type="image/png">

  <div class="shell">

    <footer class="site-footer">
